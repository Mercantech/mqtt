# Dokploy-deploy (remote Hetzner): docker compose up -d --build
#
# Denne server har offentlig IP + host-porte (ingen lokal Traefik/dokploy-network).
# Browser-demo: http://<host>:3001  → MQTT-WS på samme origin /mqtt
# Arduino: mqtt://<host>:1883
#
# Valgfrie Traefik-labels er bevaret; de virker kun hvis containeren senere
# kommer på et netværk med Traefik (fx dokploy-network på en host med Traefik).
services:
  mqtt-pensum:
    build: .
    container_name: mqtt-pensum
    restart: unless-stopped
    ports:
      - "3001:3000"   # Pensum (HTTP)
      - "1883:1883"   # MQTT (TCP)
      - "8888:8888"   # MQTT (WebSocket direkte, valgfri)
    environment:
      HTTP_PORT: 3000
      MQTT_PORT: 1883
      WS_PORT: 8888
    labels:
      - traefik.enable=true
      - traefik.http.routers.mqtt-pensum.rule=Host(`${APP_DOMAIN:-mqtt.mercantec.tech}`)
      - traefik.http.routers.mqtt-pensum.entrypoints=web
      - traefik.http.routers.mqtt-pensum.service=mqtt-pensum
      - traefik.http.services.mqtt-pensum.loadbalancer.server.port=3000
